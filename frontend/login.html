<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — VirtuCoach</title>
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>

  <div class="auth-split">
    <!-- 左侧品牌区 -->
    <div class="auth-brand">
      <a class="brand" href="/">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <span class="brand-name">Virtu<em>Coach</em></span>
      </a>
      <h2>欢迎回来，<br><span class="grad">继续你的练习之旅</span></h2>
      <p>你的练习记录、进步曲线和 AI 报告都在等你。</p>
      <div class="auth-brand-points">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>多维评分：音准 / 节奏 / 和弦 / 手型</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>AI 生成个性化练习建议</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>练习历史与趋势可视化</span>
      </div>
    </div>

    <!-- 右侧表单区 -->
    <div class="auth-form-side">
      <div class="auth-card">
        <a class="auth-back" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          返回首页
        </a>
        <div class="form-title">登录</div>
        <div class="subtitle">使用你的 VirtuCoach 账号继续</div>
        <div class="auth-error" id="authError"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">用户名或邮箱</label>
            <input type="text" id="username" required autocomplete="username" placeholder="请输入用户名或邮箱">
          </div>
          <div class="form-group">
            <label for="password">密码</label>
            <div class="pw-wrap">
              <input type="password" id="password" required autocomplete="current-password" placeholder="请输入密码">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="显示或隐藏密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full">登 录</button>
        </form>
        <div class="auth-link">
          还没有账号？<a href="/register.html">立即注册</a>
        </div>
        <div class="auth-link" style="margin-top:8px;">
          <a href="/analysis.html">游客体验（免登录）</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      var token = sessionStorage.getItem("virtucoach_token");
      if (token) {
        // Already logged in, verify token
        fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token } })
          .then(function (r) { if (r.ok) window.location.href = "/dashboard.html"; });
      }

      document.getElementById("pwToggle").addEventListener("click", function () {
        var pw = document.getElementById("password");
        pw.type = pw.type === "password" ? "text" : "password";
      });

      document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("authError");
        err.style.display = "none";
        var btn = this.querySelector('button[type="submit"]');
        var originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "登录中...";
        try {
          var resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || "登录失败");
          sessionStorage.setItem("virtucoach_token", data.access_token);
          if (data.user) {
            sessionStorage.setItem("virtucoach_user", JSON.stringify(data.user));
          }
          window.location.href = "/dashboard.html";
        } catch (ex) {
          err.textContent = ex.message;
          err.style.display = "block";
          btn.disabled = false;
          btn.textContent = originalText;
        }
      });
    })();
  </script>
</body>
</html>
