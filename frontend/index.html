<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VirtuCoach - AI 吉他陪练系统</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .landing { text-align:center; padding:60px 20px 40px; }
    .landing .hero-icon { font-size:64px; margin-bottom:16px; }
    .landing h1 { font-size:36px; margin:0 0 8px; background:linear-gradient(135deg,var(--primary-light),var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .landing .tagline { color:var(--text-dim); font-size:18px; margin-bottom:32px; }
    .landing .hero-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:48px; }
    .landing .hero-btns .btn { padding:14px 32px; font-size:16px; border-radius:10px; }
    .features { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; max-width:560px; margin:0 auto; }
    .feature-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px 18px; text-align:center; }
    .feature-card .ficon { font-size:36px; margin-bottom:10px; }
    .feature-card h3 { margin:0 0 6px; font-size:16px; }
    .feature-card p { color:var(--text-dim); font-size:13px; margin:0; }
    .footer { text-align:center; color:var(--text-dim); font-size:12px; padding:40px 20px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="landing">
      <div class="hero-icon">🎸</div>
      <h1>VirtuCoach</h1>
      <p class="tagline">AI 驱动的吉他陪练系统 — 上传演奏视频，获得专业分析报告</p>
      <div class="hero-btns" id="heroBtns">
        <button class="btn btn-primary" onclick="window.location.href='/login.html'">登 录</button>
        <button class="btn btn-secondary" onclick="window.location.href='/register.html'">注 册</button>
        <button class="btn btn-secondary" onclick="window.location.href='/analysis.html'">游客体验</button>
      </div>
    </div>

    <div class="features">
      <div class="feature-card">
        <div class="ficon">🎵</div>
        <h3>音频分析</h3>
        <p>音准检测、节奏评估、和弦识别，精准定位每个音符的问题</p>
      </div>
      <div class="feature-card">
        <div class="ficon">✋</div>
        <h3>手型检测</h3>
        <p>MediaPipe手部关键点 + AI视觉分析，纠正错误按弦姿势</p>
      </div>
      <div class="feature-card">
        <div class="ficon">🤖</div>
        <h3>AI 报告</h3>
        <p>DeepSeek生成个性化练习建议，针对性改善演奏技巧</p>
      </div>
      <div class="feature-card">
        <div class="ficon">📈</div>
        <h3>进步追踪</h3>
        <p>记录每次练习数据，可视化进步曲线，见证成长</p>
      </div>
    </div>

    <div class="footer">
      VirtuCoach &copy; 2026 · AI Guitar Practice Coach
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      if (VirtuCoach.isLoggedIn()) {
        document.getElementById("heroBtns").innerHTML =
          '<button class="btn btn-primary" onclick="window.location.href=\'/dashboard.html\'" style="padding:14px 32px;font-size:16px;">进入控制台</button>' +
          '<button class="btn btn-secondary" onclick="window.location.href=\'/analysis.html\'" style="padding:14px 32px;font-size:16px;">开始练习</button>';
      }
    })();
  </script>
</body>
</html>
